[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rein-ai"
version = "0.1.0"
description = "Governance layer for autonomous agents: regime detection, circuit breakers, strategy scoring, audit trail"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "John N.W. Hampton Jr", email = "firekicks@gmail.com"}]
keywords = ["agent", "governance", "risk", "llm", "trading", "circuit-breaker", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
]
dependencies = []

[project.optional-dependencies]
api  = ["fastapi>=0.100", "pydantic>=2.0"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev  = ["rein-ai[api,test]"]

[project.scripts]
rein = "rein_ai.cli:main"

[project.urls]
Homepage = "https://github.com/rein-ai/rein-ai"
Issues   = "https://github.com/rein-ai/rein-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rein_ai = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
