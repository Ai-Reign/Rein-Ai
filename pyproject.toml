[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-ai"
version = "0.1.0"
description = "Governance layer for autonomous agents: regime detection, circuit breakers, strategy scoring, audit trail"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "John Hampton", email = "firekicks@gmail.com"}]
keywords = ["agent", "governance", "risk", "llm", "trading", "circuit-breaker", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
api  = ["fastapi>=0.100", "pydantic>=2.0"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev  = ["tripwire-ai[api,test]"]

[project.scripts]
tripwire = "tripwire_ai.cli:main"

[project.urls]
Homepage = "https://github.com/firekicks/tripwire-ai"
Issues   = "https://github.com/firekicks/tripwire-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tripwire_ai = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
